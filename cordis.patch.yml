# Remote-host tools bundle overlay: mount the five packages beside the base.
# Install:  dsh plugin --profile <name> add @cryptocurpays/dsh-remote-tools
# Dev overlay:  dsh web --patch ./cordis.patch.yml
# See docs/install.md.
#
# The Web template does not ship the terminal seam; this bundle inserts it
# so the SSH backend can register. If the profile already has a `terminal`
# row, drop that duplicate from the profile patch.
- insert:
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'

    - id: remote-hosts
      name: '@cryptocurpays/dsh-remote-hosts'

    - id: remote-hosts-jumpserver
      name: '@cryptocurpays/dsh-remote-hosts-jumpserver'

    - id: remote-hosts-file
      name: '@cryptocurpays/dsh-remote-hosts-file'

    - id: terminal-ssh
      name: '@cryptocurpays/dsh-terminal-ssh'

    - id: tool-remote
      name: '@cryptocurpays/dsh-tool-remote'
