# Remote-host tools bundle overlay: mount the five packages beside the base.
# Install:  dsh plugin --profile <name> add /path/to/dsh-remote-tools
# Dev overlay:  dsh web --patch ./cordis.patch.yml
# See docs/install.md.
- insert:
    - id: remote-hosts
      name: '@cryptocurpays/dsh-remote-hosts'

    - id: remote-hosts-jumpserver
      name: '@cryptocurpays/dsh-remote-hosts-jumpserver'

    - id: remote-hosts-file
      name: '@cryptocurpays/dsh-remote-hosts-file'

    - id: terminal-ssh
      name: '@cryptocurpays/dsh-terminal-ssh'

    - id: tool-remote
      name: '@cryptocurpays/dsh-tool-remote'
